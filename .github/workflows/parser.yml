name: Xelara Auto-Check & Sync

on:
  schedule:
    # Запуск каждые 3 часа (в 00:00, 03:00, 06:00 и т.д. по UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write # Нужно, чтобы бот мог коммитить обновленный latest.json

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Если проверка зависнет, GitHub ее прибьет

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Убрали cache: 'pip', так как нет requirements.txt

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Базовые зависимости для xelara.py
          pip install requests PySocks psutil aiohttp aiofiles PyYAML

      - name: 🚀 Run Xelara Checker
        # Скрипт находится в корне репозитория
        run: |
          python xelara.py -c 32 --timeout 10 --server-timeout 12
        
      - name: 💾 Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update configs [skip ci]"
          # Коммитим файлы из корня репозитория
          file_pattern: "output/AllWorking/latest.json output/AllWorking/latest.txt working.txt cache.json"
          commit_user_name: "Xelara Bot"
          commit_user_email: "bot@xelara.local"

      - name: 🔄 Trigger Worker Sync
        # Дергаем API вашего воркера, чтобы он обновил БД
        env:
          # Мы жестко зашиваем ваш URL из сообщения
          WORKER_URL: "https://adminvpn.xelaravpn.workers.dev"
          # ADMIN_TOKEN нужно добавить в Secrets вашего репозитория
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "⚠️ Пропускаю синхронизацию воркера, так как секрет ADMIN_TOKEN не задан."
            exit 0
          fi
          
          echo "Стучусь в воркер: $WORKER_URL/api/admin/sync"
          curl -X POST "$WORKER_URL/api/admin/sync" \
            -H "X-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{}"
